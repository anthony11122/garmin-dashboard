name: garmin-dashboard

services:
  garmin-dashboard:
    build: .
    image: garmin-dashboard:latest
    container_name: garmin-dashboard
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./src:/app/src
      - ./templates:/app/templates
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
